[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "js-endpoints-hunter"
version = "2.0.0"
description = "Local-first JavaScript endpoint and secret extractor with source maps, HAR and a Web UI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JS-Endpoints-Hunter"}]
dependencies = [
  "Flask>=3.0,<4",
  "httpx[brotli]>=0.27,<0.29",
  "requests>=2.31",
  "rich>=13",
  "pyperclip>=1.8",
  "PyYAML>=6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-asyncio>=0.21",
  "pytest-cov>=4",
  "respx>=0.20",
  "ruff>=0.4",
  "black>=24",
  "mypy>=1.8",
]

[project.scripts]
jsh = "jsh.cli:main"

[tool.setuptools.packages.find]
include = ["jsh*"]

[tool.setuptools.package-data]
"jsh.ui" = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv", ".tmp-data", ".tmp-results", ".tmp-ui-data", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/(\\.venv|\\.tmp-data|\\.tmp-results|\\.tmp-ui-data)/"

[tool.mypy]
python_version = "3.10"
files = ["jsh"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "(^|/)(\\.venv|\\.tmp-data|\\.tmp-results|\\.tmp-ui-data)/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["jsh"]
omit = ["jsh/ui/*", "tests/*"]
